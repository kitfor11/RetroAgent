<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RetroAgent — 会复盘的 AI Agent</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>RetroAgent</h1>
    <p>会复盘的 AI Agent —— 任务做对学成技能，做错记成教训，越用越强</p>
  </header>

  <main class="layout">
    <section class="col-main">
      <!-- 提交任务 -->
      <div class="card">
        <h2>提交任务</h2>
        <p class="hint">Agent 会思考（CoT）→ 调工具 → 复盘：成功提炼技能，失败提炼教训。</p>
        <div class="examples">
          <button class="chip" data-task="把 'hello world' 转成大写">转大写</button>
          <button class="chip" data-task="统计这句话有多少个单词：the quick brown fox jumps over the lazy dog">数单词</button>
          <button class="chip" data-task="把 'abcdef' 反转">反转</button>
          <button class="chip" data-task="把 demo_files 里的文本文件（.txt 和 .md）移动到 docs 子目录">整理文件</button>
        </div>
        <textarea id="task-input" rows="3" placeholder="输入一个任务，例如：把 'hello world' 转成大写"></textarea>
        <button id="task-btn" class="primary">提交任务</button>
        <div id="task-result" class="result"></div>
      </div>

      <!-- 文档问答 -->
      <div class="card">
        <h2>文档问答（RAG）</h2>
        <p class="hint">基于「选中的文件夹」问答；切换文件夹会自动重建索引，也可手动点「重建索引」。</p>
        <div class="qa-row">
          <button id="index-btn" class="ghost">重建索引</button>
          <span id="index-status" class="muted"></span>
        </div>
        <div class="qa-row">
          <input id="qa-input" placeholder="例如：这个文件夹里的文件都讲了什么？" />
          <button id="qa-btn" class="primary">提问</button>
        </div>
        <div id="qa-result" class="result"></div>
      </div>
    </section>

    <aside class="col-side">
      <div class="card">
        <h2>本地文件 <button id="files-refresh" class="ghost">刷新</button></h2>
        <button id="files-choose" class="primary choose-btn">📂 选择文件夹</button>
        <p class="hint">打开系统窗口选择文件夹，作为 Agent 的工作目录。</p>
        <div class="browser-bar">
          <button id="files-up" class="ghost">⬆ 上一级</button>
          <input id="files-path" placeholder="输入路径，如 D:/demo_files" />
          <button id="files-go" class="ghost">前往</button>
        </div>
        <div id="files-cwd" class="muted cwd"></div>
        <ul id="files-list" class="tree"></ul>
        <div id="file-preview" class="preview hidden"></div>
      </div>
      <div class="card">
        <h2>技能库 <button id="skills-refresh" class="ghost">刷新</button></h2>
        <ul id="skills-list" class="list"></ul>
      </div>
      <div class="card">
        <h2>经验记忆 <button id="memories-refresh" class="ghost">刷新</button></h2>
        <ul id="memories-list" class="list"></ul>
      </div>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
